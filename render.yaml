# Optional: Render "Blueprint" for a FREE web service.
# The database is NOT created here. Use a free Neon database and paste its address as DATABASE_URL.
services:
  - type: web
    name: stockroom
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false      # paste your Neon connection string
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false      # type the first admin password
